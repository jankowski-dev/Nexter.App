title = "Nexter gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Local development, generated, and CI-only credentials"
paths = [
  '''node_modules''',
  '''\.pnpm''',
  '''dist''',
  '''coverage''',
  '''pnpm-lock\.yaml''',
]
regexes = [
  '''postgres://postgres:postgres@''',
  '''test-setup-token''',
  '''change-me''',
  '''AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=''',
  '''ci-setup-token-0123456789abcdef0123456789abcdef''',
  '''00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff''',
  '''0x8ac76a51cc950d9822d68b83fe1ad97b32cd580d''',
  '''0x1d28d989f9e3ccb8b15d0cec601734514f958e4d''',
  '''0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48''',
  '''0x514910771af9ca656af840dff83e8264ecf986ca''',
  '''0x4f2b33840227ddd0e28da8d4185d6fa07adfed87''',
  '''0x5a9610919f5e81183823a2be4bd1beb2b4da2a20''',
]
