name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/nexter
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Secret scan
        run: >-
          docker run --rm
          -v "$PWD:/repo"
          zricethezav/gitleaks:v8.28.0
          dir /repo --config /repo/.gitleaks.toml --redact --verbose

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Migrate database
        run: pnpm db:migrate

      - name: Compile migration runner and migrate again
        run: pnpm db:migrate:prod

      - name: Static and API smoke test
        run: pnpm smoke:static

      - name: Worker syntax check
        run: pnpm smoke:worker

      - name: Build Docker image
        run: docker build -t nexter:ci .

      - name: Run API container
        run: |
          docker run -d --name nexter-api --network host \
            -e NODE_ENV=production \
            -e DATABASE_URL=postgres://postgres:postgres@localhost:5432/nexter \
            -e SETUP_TOKEN=test-setup-token \
            -e APP_URL=http://127.0.0.1:3000 \
            nexter:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/ready
          curl -fsS http://127.0.0.1:3000/dashboard > /dev/null
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/v1/unknown)" = "404"

      - name: Stop API container
        if: always()
        run: docker rm -f nexter-api || true

      - name: Run worker container
        run: |
          docker run -d --name nexter-worker --network host \
            -e NODE_ENV=production \
            -e DATABASE_URL=postgres://postgres:postgres@localhost:5432/nexter \
            nexter:ci node apps/worker/dist/main.js
          for attempt in $(seq 1 30); do
            if docker logs nexter-worker 2>&1 | grep -q "Nexter worker started"; then
              exit 0
            fi
            sleep 1
          done
          docker logs nexter-worker
          exit 1

      - name: Stop worker container
        if: always()
        run: docker rm -f nexter-worker || true

      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high
