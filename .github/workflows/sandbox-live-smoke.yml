name: Sandbox live smoke

# Manual only: this workflow touches real public market-data providers and a
# disposable Postgres. It never runs on push or pull_request.
on:
  workflow_dispatch:

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexter_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/nexter_test
      NODE_ENV: development
      SETUP_TOKEN: live-smoke-setup-token-0123456789abcdef
      AUTH_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      NEXTER_TEST_DB: '1'
      SANDBOX_LIVE_SMOKE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build:packages

      - name: Migrate disposable database
        run: pnpm db:migrate

      - name: Provider ingestion smoke (no Postgres writes)
        working-directory: apps/api
        run: npx vitest run test/sandbox-live-smoke.e2e.spec.ts

      - name: Live tick smoke (Postgres + real providers)
        working-directory: apps/api
        run: npx vitest run test/sandbox-live-tick-smoke.e2e.spec.ts
